<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>用户登录</title>

  <script src="http://code.jquery.com/jquery-2.1.1.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;

      color: #303846;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;

      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(76, 110, 245, 0.13),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 15%,
          rgba(120, 90, 240, 0.10),
          transparent 28%
        ),
        linear-gradient(180deg, #f8faff 0%, #f2f5fa 100%);
    }

    /* 页面左右装饰 */
    .side-decoration {
      position: fixed;
      top: 0;
      width: 230px;
      height: 100vh;
      pointer-events: none;
    }

    .left-decoration {
      left: 0;
    }

    .right-decoration {
      right: 0;
    }

    .decor-panel {
      position: absolute;
      width: 150px;
      padding: 22px;

      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 24px;

      background: rgba(255, 255, 255, 0.42);

      box-shadow:
        0 20px 45px rgba(68, 84, 130, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .left-decoration .decor-panel {
      top: 210px;
      left: 28px;
      height: 210px;
      transform: rotate(-3deg);
    }

    .right-decoration .decor-panel {
      top: 330px;
      right: 28px;
      height: 190px;
      transform: rotate(3deg);
    }

    .decor-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      margin-right: 5px;
      border-radius: 50%;
      background: rgba(78, 110, 242, 0.35);
    }

    .decor-dot:nth-child(2) {
      background: rgba(118, 85, 232, 0.32);
    }

    .decor-dot:nth-child(3) {
      background: rgba(54, 190, 160, 0.32);
    }

    .decor-line {
      height: 8px;
      margin-top: 18px;
      border-radius: 20px;

      background: linear-gradient(
        90deg,
        rgba(78, 110, 242, 0.25),
        rgba(118, 85, 232, 0.08)
      );
    }

    .line-long {
      width: 100%;
    }

    .line-medium {
      width: 78%;
    }

    .line-short {
      width: 55%;
    }

    .decor-block {
      height: 28px;
      margin-bottom: 13px;
      border-radius: 10px;

      background: linear-gradient(
        135deg,
        rgba(78, 110, 242, 0.20),
        rgba(118, 85, 232, 0.08)
      );
    }

    .block-one {
      width: 92%;
    }

    .block-two {
      width: 70%;
      margin-left: 20%;
    }

    .block-three {
      width: 82%;
    }

    .decor-bottom-line {
      width: 55%;
      height: 7px;
      margin-top: 20px;
      border-radius: 20px;
      background: rgba(78, 110, 242, 0.18);
    }

    .decor-circle {
      position: absolute;
      border-radius: 50%;
      animation: float 6s ease-in-out infinite;
    }

    .circle-one {
      top: 90px;
      left: 50px;
      width: 92px;
      height: 92px;
      border: 18px solid rgba(78, 110, 242, 0.08);
    }

    .circle-two {
      top: 500px;
      left: 120px;
      width: 48px;
      height: 48px;

      background: linear-gradient(
        135deg,
        rgba(116, 86, 232, 0.18),
        rgba(78, 110, 242, 0.05)
      );
    }

    .decor-ring {
      position: absolute;
      top: 105px;
      right: 38px;

      width: 125px;
      height: 125px;

      border: 20px solid rgba(102, 86, 230, 0.07);
      border-radius: 50%;

      animation: rotate 14s linear infinite;
    }

    /* 登录主体 */
    .login-box {
      position: relative;
      z-index: 10;

      width: min(420px, 100%);
      padding: 42px 38px;

      border: 1px solid rgba(220, 225, 237, 0.9);
      border-radius: 22px;

      background: rgba(255, 255, 255, 0.88);

      box-shadow:
        0 20px 50px rgba(61, 78, 120, 0.12),
        0 3px 10px rgba(61, 78, 120, 0.05);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .title {
      margin-bottom: 8px;
      text-align: center;
      font-size: 27px;
      font-weight: 700;
      color: #303846;
    }

    .subtitle {
      margin-bottom: 30px;
      text-align: center;
      font-size: 14px;
      color: #8891a2;
    }

    .input-group {
      margin-bottom: 17px;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      color: #4c5668;
      font-size: 14px;
      font-weight: 600;
    }

    .input-group input {
      width: 100%;
      height: 48px;
      padding: 0 16px;

      border: 1px solid #dce3ef;
      border-radius: 13px;
      outline: none;

      color: #303846;
      font-size: 15px;

      background: rgba(255, 255, 255, 0.85);

      transition:
        border-color 0.25s ease,
        box-shadow 0.25s ease,
        transform 0.25s ease;
    }

    .input-group input:focus {
      border-color: rgba(78, 110, 242, 0.65);
      box-shadow: 0 0 0 4px rgba(78, 110, 242, 0.10);
    }

    .input-group input::placeholder {
      color: #a7afbd;
    }

    button {
      font-family: inherit;
    }

    .login-btn,
    .register-btn {
      width: 100%;
      height: 48px;

      border: none;
      border-radius: 13px;

      font-size: 16px;
      font-weight: 600;
      letter-spacing: 1px;

      cursor: pointer;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        filter 0.2s ease;
    }

    .login-btn {
      margin-top: 6px;

      color: #fff;

      background: linear-gradient(135deg, #4e6ef2, #6955e8);

      box-shadow:
        0 8px 18px rgba(78, 110, 242, 0.25);
    }

    .login-btn:hover {
      filter: brightness(1.06);
      transform: translateY(-2px);
      box-shadow:
        0 11px 23px rgba(78, 110, 242, 0.32);
    }

    .register-btn {
      margin-top: 13px;

      color: #506078;
      border: 1px solid #dce3ef;

      background: rgba(255, 255, 255, 0.72);
    }

    .register-btn:hover {
      color: #4e6ef2;
      border-color: rgba(78, 110, 242, 0.35);
      background: rgba(78, 110, 242, 0.05);
      transform: translateY(-1px);
    }

    /* =========================
       滑入式消息提示
       ========================= */

    .toast {
      position: fixed;
      top: 30px;
      right: 30px;
      z-index: 9999;

      display: flex;
      min-width: 320px;
      max-width: 420px;

      align-items: center;

      padding: 16px 20px;

      color: #b42318;
      font-size: 15px;
      font-weight: 500;

      border: 1px solid rgba(220, 53, 69, 0.18);
      border-left: 4px solid #dc3545;
      border-radius: 14px;

      background: rgba(255, 255, 255, 0.96);

      box-shadow:
        0 15px 40px rgba(50, 60, 90, 0.16),
        0 3px 8px rgba(50, 60, 90, 0.06);

      backdrop-filter: blur(10px);

      opacity: 0;

      transform: translateX(calc(100% + 60px));

      transition:
        transform 0.45s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.35s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(0);
    }

    .toast-icon {
      display: flex;

      width: 28px;
      height: 28px;

      margin-right: 12px;

      align-items: center;
      justify-content: center;

      flex-shrink: 0;

      color: #fff;
      font-size: 17px;
      font-weight: bold;

      border-radius: 50%;

      background: #dc3545;
    }

    @keyframes float {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-14px);
      }
    }

    @keyframes rotate {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 900px) {
      .side-decoration {
        display: none;
      }
    }

    @media (max-width: 520px) {
      .login-box {
        padding: 35px 25px;
      }

      .toast {
        top: 18px;
        right: 15px;
        left: 15px;

        min-width: 0;
        max-width: none;

        transform: translateY(-120px);
      }

      .toast.show {
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <!-- 左侧装饰 -->
  <div class="side-decoration left-decoration">
    <div class="decor-circle circle-one"></div>
    <div class="decor-circle circle-two"></div>

    <div class="decor-panel">
      <span class="decor-dot"></span>
      <span class="decor-dot"></span>
      <span class="decor-dot"></span>

      <div class="decor-line line-long"></div>
      <div class="decor-line line-medium"></div>
      <div class="decor-line line-short"></div>
    </div>
  </div>

  <!-- 右侧装饰 -->
  <div class="side-decoration right-decoration">
    <div class="decor-ring"></div>

    <div class="decor-panel">
      <div class="decor-block block-one"></div>
      <div class="decor-block block-two"></div>
      <div class="decor-block block-three"></div>
      <div class="decor-bottom-line"></div>
    </div>
  </div>

  <!-- 滑入提示 -->
  <div class="toast" id="toast">
    <div class="toast-icon">!</div>
    <span id="toast-text"></span>
  </div>

  <div class="login-box">

    <div class="title">Boost 搜索引擎</div>

    <div class="subtitle">
      欢迎回来，请登录您的账号
    </div>

    <div class="input-group">
      <label>用户名</label>
      <input
        id="username"
        type="text"
        placeholder="请输入用户名"
      />
    </div>

    <div class="input-group">
      <label>密码</label>
      <input
        id="password"
        type="password"
        placeholder="请输入密码"
      />
    </div>

    <button class="login-btn" onclick="Login()">
      登录
    </button>

    <button
      class="register-btn"
      onclick="location.href='/register.html'"
    >
      注册账号
    </button>
  </div>

  <script>
    let toastTimer = null;

    function ShowError(msg) {
      let toast = $("#toast");

      $("#toast-text").text(msg);

      clearTimeout(toastTimer);

      toast.removeClass("show");

      // 保证连续触发消息时动画能够重新执行
      setTimeout(function () {
        toast.addClass("show");
      }, 20);

      // 停留5秒后滑出
      toastTimer = setTimeout(function () {
        toast.removeClass("show");
      }, 5000);
    }

    /*
     * 如果 search.html 因登录状态失效跳转回来，
     * 则显示对应提示。
     */
    let loginMessage = sessionStorage.getItem("loginMessage");

    if (loginMessage != null) {
      sessionStorage.removeItem("loginMessage");

      setTimeout(function () {
        ShowError(loginMessage);
      }, 300);
    }

    function Login() {
      let username = $("#username").val();
      let password = $("#password").val();

      $.ajax({
        type: "POST",

        url: "/login",

        data: {
          username: username,
          password: password,
        },

        success: function (data) {

          if (data == "登录成功") {

            sessionStorage.clear();

            sessionStorage.setItem("login", "true");

            sessionStorage.setItem(
              "username",
              username
            );

            location.href = "/search.html";

          } else {

            ShowError(data);

          }
        },
      });
    }

    // 回车登录
    $("#password").on("keydown", function (event) {
      if (event.key === "Enter") {
        Login();
      }
    });
  </script>

</body>
</html>
