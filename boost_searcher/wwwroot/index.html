<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Boost 搜索引擎</title>

    <script src="http://code.jquery.com/jquery-2.1.1.min.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        scroll-behavior: smooth;
      }

      body {
        position: relative;
        min-height: 100vh;
        padding: 55px 20px;
        overflow-x: hidden;
        color: #303846;
        font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
        background:
          radial-gradient(
            circle at 15% 10%,
            rgba(76, 110, 245, 0.13),
            transparent 30%
          ),
          radial-gradient(
            circle at 85% 15%,
            rgba(120, 90, 240, 0.1),
            transparent 28%
          ),
          linear-gradient(180deg, #f8faff 0%, #f2f5fa 100%);
        background-attachment: fixed;
      }

      button,
      input {
        font-family: inherit;
      }

      /* 主体区域 */
      .container {
        position: relative;
        z-index: 2;
        width: min(860px, 100%);
        margin: 0 auto;
      }

      /* 搜索栏 */
      .container .search {
        position: sticky;
        top: 18px;
        z-index: 10;
        display: flex;
        width: 100%;
        height: 58px;
        padding: 5px;
        border: 1px solid rgba(220, 225, 237, 0.9);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.88);
        box-shadow:
          0 12px 35px rgba(61, 78, 120, 0.1),
          0 2px 8px rgba(61, 78, 120, 0.04);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        transition:
          border-color 0.25s ease,
          box-shadow 0.25s ease;
      }

      .container .search:focus-within {
        border-color: rgba(78, 110, 242, 0.5);
        box-shadow:
          0 0 0 4px rgba(78, 110, 242, 0.1),
          0 15px 38px rgba(61, 78, 120, 0.12);
      }

      .container .search input {
        flex: 1;
        min-width: 0;
        height: 46px;
        padding: 0 18px;
        border: none;
        outline: none;
        color: #303846;
        font-size: 16px;
        background: transparent;
      }

      .container .search button {
        width: 145px;
        height: 46px;
        border: none;
        border-radius: 13px;
        color: #ffffff;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 1px;
        cursor: pointer;
        background: linear-gradient(135deg, #4e6ef2, #6955e8);
        box-shadow: 0 6px 15px rgba(78, 110, 242, 0.25);
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease,
          filter 0.2s ease;
      }

      .container .search button:hover {
        filter: brightness(1.06);
        transform: translateY(-1px);
        box-shadow: 0 9px 20px rgba(78, 110, 242, 0.32);
      }

      .container .search button:active {
        transform: scale(0.98);
      }

      /* 搜索结果区域 */
      .container .result {
        width: 100%;
        padding-bottom: 50px;
      }

      .container .result .item {
        position: relative;
        margin-top: 18px;
        padding: 23px 25px;
        overflow: hidden;
        border: 1px solid rgba(222, 227, 237, 0.9);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow:
          0 7px 24px rgba(54, 72, 110, 0.06),
          0 2px 6px rgba(54, 72, 110, 0.03);

        opacity: 0;
        transform: translateY(35px);
        transition:
          opacity 0.65s ease,
          transform 0.65s ease,
          border-color 0.25s ease,
          box-shadow 0.25s ease;
      }

      .container .result .item::before {
        position: absolute;
        top: 0;
        left: 0;
        width: 4px;
        height: 100%;
        content: "";
        opacity: 0;
        background: linear-gradient(180deg, #4e6ef2, #8159ef);
        transition: opacity 0.25s ease;
      }

      .container .result .item.show {
        opacity: 1;
        transform: translateY(0);
      }

      .container .result .item.show:hover {
        border-color: rgba(78, 110, 242, 0.25);
        box-shadow:
          0 15px 35px rgba(54, 72, 110, 0.12),
          0 4px 10px rgba(54, 72, 110, 0.05);
        transform: translateY(-4px);
      }

      .container .result .item:hover::before {
        opacity: 1;
      }

      .container .result .item a {
        display: inline-block;
        color: #3154d8;
        font-size: 20px;
        font-weight: 600;
        line-height: 1.5;
        text-decoration: none;
        transition: color 0.2s ease;
      }

      .container .result .item a:hover {
        color: #1f3ba8;
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 4px;
      }

      .container .result .item p {
        margin-top: 10px;
        color: #4f596b;
        font-size: 15px;
        line-height: 1.8;
        word-break: break-word;
      }

      .container .result .item i {
        display: block;
        margin-top: 12px;
        overflow: hidden;
        color: #198754;
        font-size: 14px;
        font-style: normal;
        line-height: 1.5;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* 左右两侧装饰区域 */
      .side-decoration {
        position: fixed;
        top: 0;
        z-index: 1;
        width: 230px;
        height: 100vh;
        pointer-events: none;
      }

      .left-decoration {
        left: 0;
      }

      .right-decoration {
        right: 0;
      }

      /* 半透明装饰面板 */
      .decor-panel {
        position: absolute;
        width: 150px;
        padding: 22px;
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.42);
        box-shadow:
          0 20px 45px rgba(68, 84, 130, 0.08),
          inset 0 1px 0 rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }

      .left-decoration .decor-panel {
        top: 210px;
        left: 28px;
        height: 210px;
        transform: rotate(-3deg);
      }

      .right-decoration .decor-panel {
        top: 330px;
        right: 28px;
        height: 190px;
        transform: rotate(3deg);
      }

      /* 左侧面板圆点 */
      .decor-dot {
        display: inline-block;
        width: 9px;
        height: 9px;
        margin-right: 5px;
        border-radius: 50%;
        background: rgba(78, 110, 242, 0.35);
      }

      .decor-dot:nth-child(2) {
        background: rgba(118, 85, 232, 0.32);
      }

      .decor-dot:nth-child(3) {
        background: rgba(54, 190, 160, 0.32);
      }

      /* 左侧面板线条 */
      .decor-line {
        height: 8px;
        margin-top: 18px;
        border-radius: 20px;
        background: linear-gradient(
          90deg,
          rgba(78, 110, 242, 0.25),
          rgba(118, 85, 232, 0.08)
        );
      }

      .line-long {
        width: 100%;
      }

      .line-medium {
        width: 78%;
      }

      .line-short {
        width: 55%;
      }

      /* 右侧面板方块 */
      .decor-block {
        height: 28px;
        margin-bottom: 13px;
        border-radius: 10px;
        background: linear-gradient(
          135deg,
          rgba(78, 110, 242, 0.2),
          rgba(118, 85, 232, 0.08)
        );
      }

      .block-one {
        width: 92%;
      }

      .block-two {
        width: 70%;
        margin-left: 20%;
      }

      .block-three {
        width: 82%;
      }

      .decor-bottom-line {
        width: 55%;
        height: 7px;
        margin-top: 20px;
        border-radius: 20px;
        background: rgba(78, 110, 242, 0.18);
      }

      /* 圆形装饰 */
      .decor-circle {
        position: absolute;
        border-radius: 50%;
        filter: blur(1px);
        animation: decor-float 6s ease-in-out infinite;
      }

      .circle-one {
        top: 90px;
        left: 50px;
        width: 92px;
        height: 92px;
        border: 18px solid rgba(78, 110, 242, 0.08);
      }

      .circle-two {
        top: 470px;
        left: 120px;
        width: 48px;
        height: 48px;
        background: linear-gradient(
          135deg,
          rgba(116, 86, 232, 0.18),
          rgba(78, 110, 242, 0.05)
        );
        animation-delay: 1.5s;
      }

      .circle-three {
        top: 610px;
        right: 55px;
        width: 64px;
        height: 64px;
        background: linear-gradient(
          135deg,
          rgba(78, 110, 242, 0.16),
          rgba(74, 201, 175, 0.06)
        );
        animation-delay: 2s;
      }

      /* 右侧圆环 */
      .decor-ring {
        position: absolute;
        top: 105px;
        right: 38px;
        width: 125px;
        height: 125px;
        border: 20px solid rgba(102, 86, 230, 0.07);
        border-radius: 50%;
        box-shadow:
          inset 0 0 0 7px rgba(78, 110, 242, 0.03),
          0 15px 30px rgba(74, 92, 150, 0.05);
        animation: ring-rotate 14s linear infinite;
      }

      .decor-ring::before {
        position: absolute;
        top: -20px;
        left: 35px;
        width: 25px;
        height: 25px;
        border-radius: 50%;
        content: "";
        background: rgba(78, 110, 242, 0.2);
      }

      /* 返回顶部按钮：始终显示 */
      .back-to-top {
        position: fixed;
        right: 32px;
        bottom: 32px;
        z-index: 999;
        display: flex;
        width: 52px;
        height: 52px;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 17px;
        color: #ffffff;
        cursor: pointer;
        opacity: 1;
        visibility: visible;
        background: linear-gradient(135deg, #4e6ef2, #6955e8);
        box-shadow:
          0 12px 28px rgba(78, 110, 242, 0.3),
          0 4px 10px rgba(78, 110, 242, 0.16);
        transition:
          transform 0.25s ease,
          box-shadow 0.25s ease,
          filter 0.25s ease;
      }

      .back-to-top:hover {
        filter: brightness(1.08);
        transform: translateY(-4px);
        box-shadow:
          0 16px 32px rgba(78, 110, 242, 0.36),
          0 6px 14px rgba(78, 110, 242, 0.18);
      }

      .back-to-top:active {
        transform: scale(0.94);
      }

      .back-to-top svg {
        width: 24px;
        height: 24px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      @keyframes decor-float {
        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-14px);
        }
      }

      @keyframes ring-rotate {
        from {
          transform: rotate(0deg);
        }

        to {
          transform: rotate(360deg);
        }
      }

      /* 窗口较窄时隐藏两侧装饰 */
      @media (max-width: 1180px) {
        .side-decoration {
          display: none;
        }
      }

      /* 移动端适配 */
      @media (max-width: 650px) {
        body {
          padding: 25px 12px;
        }

        .container .search {
          top: 10px;
          height: 56px;
          border-radius: 15px;
        }

        .container .search input {
          height: 44px;
          padding: 0 12px;
          font-size: 14px;
        }

        .container .search button {
          width: 105px;
          height: 44px;
          border-radius: 11px;
          font-size: 14px;
        }

        .container .result .item {
          margin-top: 14px;
          padding: 19px 18px;
          border-radius: 14px;
        }

        .container .result .item a {
          font-size: 18px;
        }

        .container .result .item p {
          font-size: 14px;
        }

        .container .result .item i {
          font-size: 13px;
        }

        .back-to-top {
          right: 18px;
          bottom: 18px;
          width: 46px;
          height: 46px;
          border-radius: 15px;
        }

        .back-to-top svg {
          width: 21px;
          height: 21px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        .container .result .item {
          opacity: 1;
          transform: none;
          transition: none;
        }

        .decor-circle,
        .decor-ring {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <!-- 左侧装饰 -->
    <div class="side-decoration left-decoration" aria-hidden="true">
      <div class="decor-circle circle-one"></div>
      <div class="decor-circle circle-two"></div>

      <div class="decor-panel">
        <span class="decor-dot"></span>
        <span class="decor-dot"></span>
        <span class="decor-dot"></span>

        <div class="decor-line line-long"></div>
        <div class="decor-line line-medium"></div>
        <div class="decor-line line-short"></div>
      </div>
    </div>

    <!-- 右侧装饰 -->
    <div class="side-decoration right-decoration" aria-hidden="true">
      <div class="decor-ring"></div>

      <div class="decor-panel">
        <div class="decor-block block-one"></div>
        <div class="decor-block block-two"></div>
        <div class="decor-block block-three"></div>
        <div class="decor-bottom-line"></div>
      </div>

      <div class="decor-circle circle-three"></div>
    </div>

    <!-- 主体内容 -->
    <div class="container">
      <div class="search">
        <input type="text" value="输入搜索关键字..." />
        <button onclick="Search()">搜索一下</button>
      </div>

      <div class="result"></div>
    </div>

    <!-- 始终显示的返回顶部按钮 -->
    <button
      class="back-to-top"
      id="back-to-top"
      type="button"
      title="返回顶部"
      aria-label="返回页面顶部"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 15l6-6 6 6"></path>
      </svg>
    </button>

    <script>
      let resultObserver = null;

      function Search() {
        let query = $(".container .search input").val();
        if ("" == query || null == query) {
          return;
        }
        console.log("query = " + query);

        // 发起 HTTP 请求
        $.ajax({
          type: "GET",
          url: "/s?word=" + query,
          success: function (data) {
            console.log(data);
            BuildHtml(data);
          },
        });
      }

      function BuildHtml(data) {
        if ("" == data || null == data) {
          alert("搜索的内容不存在");
          return;
        }
        let result_label = $(".container .result");
        result_label.empty();

        for (let elem of data) {
          let a_label = $("<a>", {
            text: elem.title,
            href: elem.url,
            target: "_blank",
          });

          let p_label = $("<p>", {
            text: elem.desc,
          });

          let i_label = $("<i>", {
            text: elem.url,
          });

          let div_label = $("<div>", {
            class: "item",
          });

          a_label.appendTo(div_label);
          p_label.appendTo(div_label);
          i_label.appendTo(div_label);
          div_label.appendTo(result_label);
        }

        ShowResultItems();
      }

      function ShowResultItems() {
        if (resultObserver) {
          resultObserver.disconnect();
        }

        if (!("IntersectionObserver" in window)) {
          $(".container .result .item").addClass("show");
          return;
        }

        resultObserver = new IntersectionObserver(
          function (entries, observer) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                entry.target.classList.add("show");
                observer.unobserve(entry.target);
              }
            });
          },
          {
            threshold: 0.12,
            rootMargin: "0px 0px -25px 0px",
          },
        );

        $(".container .result .item").each(function (index) {
          this.style.transitionDelay = Math.min(index * 50, 250) + "ms";

          resultObserver.observe(this);
        });
      }

      // 点击按钮平滑返回页面顶部
      document
        .getElementById("back-to-top")
        .addEventListener("click", function () {
          window.scrollTo({
            top: 0,
            behavior: "smooth",
          });
        });
    </script>
  </body>
</html>
