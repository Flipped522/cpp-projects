<!doctype html>
<html lang="zh-CN">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>注册成功</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      position: relative;

      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      padding: 20px;

      color: #303846;

      font-family:
        "Microsoft YaHei",
        "PingFang SC",
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(76, 110, 245, 0.13),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 15%,
          rgba(120, 90, 240, 0.10),
          transparent 28%
        ),
        linear-gradient(
          180deg,
          #f8faff 0%,
          #f2f5fa 100%
        );
    }


    .success-box {
      position: relative;

      z-index: 10;

      width: min(420px, 100%);

      padding:
        45px 38px;

      text-align: center;

      border:
        1px solid
        rgba(220, 225, 237, 0.9);

      border-radius: 22px;

      background:
        rgba(255, 255, 255, 0.88);

      box-shadow:
        0 20px 50px
          rgba(61, 78, 120, 0.12),
        0 3px 10px
          rgba(61, 78, 120, 0.05);

      backdrop-filter:
        blur(14px);
    }


    .success-icon {
      display: flex;

      width: 72px;
      height: 72px;

      margin:
        0 auto 22px;

      align-items: center;
      justify-content: center;

      color: #ffffff;

      font-size: 35px;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          #38b889,
          #198754
        );

      box-shadow:
        0 10px 25px
        rgba(25, 135, 84, 0.24);
    }


    h2 {
      margin-bottom: 10px;

      color: #303846;

      font-size: 27px;
    }


    p {
      margin-bottom: 28px;

      color: #8891a2;

      font-size: 14px;

      line-height: 1.8;
    }


    button {
      width: 100%;

      height: 48px;

      border: none;

      border-radius: 13px;

      color: white;

      font-family: inherit;

      font-size: 16px;

      font-weight: 600;

      letter-spacing: 1px;

      cursor: pointer;

      background:
        linear-gradient(
          135deg,
          #4e6ef2,
          #6955e8
        );

      box-shadow:
        0 8px 18px
          rgba(78, 110, 242, 0.25);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        filter 0.2s ease;
    }


    button:hover {

      filter:
        brightness(1.06);

      transform:
        translateY(-2px);

      box-shadow:
        0 11px 23px
        rgba(78, 110, 242, 0.32);
    }


    /* 背景装饰 */

    .circle {
      position: absolute;

      border-radius: 50%;

      pointer-events: none;

      animation:
        float 6s ease-in-out infinite;
    }


    .circle-one {
      top: 80px;
      left: 8%;

      width: 130px;
      height: 130px;

      border:
        24px solid
        rgba(78, 110, 242, 0.06);
    }


    .circle-two {
      right: 10%;
      bottom: 100px;

      width: 100px;
      height: 100px;

      background:
        linear-gradient(
          135deg,
          rgba(105, 85, 232, 0.15),
          rgba(78, 110, 242, 0.03)
        );

      animation-delay:
        1.5s;
    }


    .panel {
      position: absolute;

      top: 150px;
      right: 8%;

      width: 160px;
      height: 210px;

      padding: 23px;

      border:
        1px solid
        rgba(255, 255, 255, 0.8);

      border-radius: 25px;

      background:
        rgba(255, 255, 255, 0.38);

      box-shadow:
        0 20px 45px
        rgba(68, 84, 130, 0.08);

      transform:
        rotate(4deg);
    }


    .panel-line {
      height: 9px;

      margin-bottom: 17px;

      border-radius: 20px;

      background:
        linear-gradient(
          90deg,
          rgba(78, 110, 242, 0.20),
          rgba(105, 85, 232, 0.05)
        );
    }


    .panel-line:nth-child(1) {
      width: 100%;
    }

    .panel-line:nth-child(2) {
      width: 75%;
    }

    .panel-line:nth-child(3) {
      width: 88%;
    }

    .panel-line:nth-child(4) {
      width: 55%;
    }


    @keyframes float {

      0%,
      100% {

        transform:
          translateY(0);

      }

      50% {

        transform:
          translateY(-15px);

      }

    }


    @media (max-width: 850px) {

      .circle,
      .panel {

        display: none;

      }

    }

  </style>

</head>


<body>

  <div class="circle circle-one"></div>

  <div class="circle circle-two"></div>


  <div class="panel">

    <div class="panel-line"></div>

    <div class="panel-line"></div>

    <div class="panel-line"></div>

    <div class="panel-line"></div>

  </div>


  <div class="success-box">

    <div class="success-icon">
      ✓
    </div>

    <h2>
      注册成功
    </h2>

    <p>
      您的账号已经创建成功，
      <br />
      现在可以返回登录页面进行登录。
    </p>

    <button
      onclick="location.href='/login.html'"
    >
      返回登录页面
    </button>

  </div>

</body>

</html>
